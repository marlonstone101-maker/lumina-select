<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop Easy Select</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --accent: #ffd700;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: Arial, sans-serif;
        }

        header {
            text-align: center;
            padding: 30px 20px;
            background-color: #181818;
            border-bottom: 1px solid #2a2a2a;
        }

        .logo-container img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--accent);
        }

        h1 {
            margin: 10px 0 5px;
            color: var(--accent);
            font-size: 1.8rem;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin: 0;
        }

        .search-bar {
            max-width: 600px;
            margin: 20px auto;
            padding: 0 20px;
        }

        .search-bar input {
            width: 100%;
            padding: 12px 20px;
            border-radius: 25px;
            border: 1px solid #333;
            background-color: #1e1e1e;
            color: var(--text-main);
            font-size: 1rem;
            box-sizing: border-box;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 1px solid #2a2a2a;
        }

        .card-img {
            width: 100%;
            height: 180px;
            background: #202020;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 0.9rem;
            cursor: pointer;
        }

        .card-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.2s;
        }

        .card-img:hover img {
            transform: scale(1.03);
        }

        .card-content {
            padding: 16px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .card-title {
            font-size: 1rem;
            font-weight: bold;
            margin-bottom: 10px;
            color: var(--text-main);
        }

        .card-price {
            font-size: 1.1rem;
            color: var(--accent);
            font-weight: bold;
            margin-bottom: 15px;
        }

        .btn-buy {
            display: block;
            text-align: center;
            background-color: var(--accent);
            color: #000;
            padding: 10px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            margin-top: auto;
        }

        .btn-buy:hover {
            opacity: 0.9;
        }

        /* Modal Viewer Styles */
        #imageModal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
        }

        #imageModal img {
            max-width: 90%;
            max-height: 90vh;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        #imageModal .close-modal {
            position: absolute;
            top: 20px;
            right: 30px;
            color: #fff;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <img src="logo.png" alt="Shop Easy Select Logo">
        </div>
        <h1>SHOP EASY SELECT</h1>
        <p class="subtitle">Curated Deals & Top Recommendations</p>
    </header>

    <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Search curated products..." onkeyup="filterProducts()">
    </div>

    <div class="container">
        <div class="grid" id="productGrid">
            
            <!-- Product Card 1 -->
            <div class="card" data-title="wireless bluetooth headphones">
                <div class="card-img" onclick="openModal(this.querySelector('img').src)">
                    <img src="https://img.ltwebstatic.com/v4/j/spmp/2025/08/02/4b/1754114763eb32b56d1542ca6208015950d16469dd_square.jpg" alt="Product Image">
                </div>
                <div class="card-content">
                    <div class="card-title">Noise Canceling Earbuds Wireless Headset Clear Voice Calls</div>
                    <div class="card-price">$5.40</div>
                    <a href="https://onelink.shein.com/48/5yzjaok4jwq2" target="_blank" class="btn-buy">View Best Deal</a>
                </div>
            </div>

            <!-- Product Card 2 -->
            <div class="card" data-title="smart fitness watch tracker">
                <div class="card-img" onclick="openModal(this.querySelector('img').src)">
                    <img src="https://m.media-amazon.com/images/I/51uS5zMD1XL._AC_SL1500_.jpg" alt="Soundcore P30i">
                </div>
                <div class="card-content">
                    <div class="card-title">Soundcore P30i by Anker Noise Cancelling Earbuds</div>
                    <div class="card-price">$84.99</div>
                    <a href="https://amzn.to/3TP1mT3" target="_blank" class="btn-buy">View Best Deal</a>
                </div>
            </div>

            <!-- Product Card 3 -->
            <div class="card" data-title="smart fitness watch tracker">
                <div class="card-img" onclick="openModal(this.querySelector('img').src)">
                    <img src="https://m.media-amazon.com/images/I/51HbL1WS+KL._AC_SL1500_.jpg" alt="Product Image">
                </div>
                <div class="card-content">
                    <div class="card-title">Soundcore P30i by Anker Noise Cancelling Earbuds</div>
                    <div class="card-price">$29.99</div>
                    <a href="https://amzn.to/4wrSMa7" target="_blank" class="btn-buy">View Best Deal</a>
                </div>
            </div>

        </div>
    </div>

    <!-- Modal View Box -->
    <div id="imageModal" onclick="closeModal()">
        <span class="close-modal">&times;</span>
        <img id="modalImg" src="" alt="Zoomed Product Image">
    </div>

    <script>
        function filterProducts() {
            let input = document.getElementById('searchInput').value.toLowerCase();
            let cards = document.getElementsByClassName('card');

            for (let i = 0; i < cards.length; i++) {
                let title = cards[i].getAttribute('data-title');
                if (title.includes(input)) {
                    cards[i].style.display = "";
                } else {
                    cards[i].style.display = "none";
                }
            }
        }

        function openModal(imgSrc) {
            let modal = document.getElementById('imageModal');
            let modalImg = document.getElementById('modalImg');
            modal.style.display = "flex";
            modalImg.src = imgSrc;
        }

        function closeModal() {
            document.getElementById('imageModal').style.display = "none";
        }
    </script>
</body>
</html>
